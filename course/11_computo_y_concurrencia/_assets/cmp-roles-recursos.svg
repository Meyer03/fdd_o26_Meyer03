<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Cuatro columnas con cuatro roles distintos. Event loop: quién corre; planifica las tareas en un solo hilo y await libera ese hilo. Semáforo: quién entra; cuenta k permisos, no guarda objetos, y await no suelta el permiso. Pool: qué conexión usas; guarda conexiones reales, las abre, presta, recupera, cierra y reemplaza si se rompen, y await no devuelve la conexión. Servidor o base de datos: quién ejecuta, del otro lado de la red; el servidor de la clase usa un hilo por conexión. Abajo, una petición las recorre: corre hasta su await, toma un permiso con acquire, toma una conexión con get, el servidor ejecuta; al volver la respuesta, put devuelve la conexión, release suelta el permiso y el loop reanuda la tarea."><rect x="0" y="0" width="1080" height="640" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Cuatro roles distintos en una sola petición</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">loop, semáforo y pool viven en el cliente; el servidor o la BD, del otro lado de la red</text><rect x="30" y="96" width="240" height="280" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="150.0" y="128" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Event loop</text><text x="150.0" y="154" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">quién corre</text><line x1="50.0" y1="170.0" x2="250.0" y2="170.0" stroke="#4a7a63" stroke-width="1"/><text x="150.0" y="196" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">planifica las tareas</text><text x="150.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">en un solo hilo</text><text x="150.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">una tarea cede en await</text><text x="150.0" y="268" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y corre otra</text><text x="150.0" y="310" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">asyncio.run(main())</text><text x="150.0" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await libera el hilo: sí</text><rect x="290" y="96" width="240" height="280" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="410.0" y="128" fill="#ffc857" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Semáforo</text><text x="410.0" y="154" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">quién entra</text><line x1="310.0" y1="170.0" x2="510.0" y2="170.0" stroke="#4a7a63" stroke-width="1"/><text x="410.0" y="196" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cuenta k permisos</text><text x="410.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no guarda objetos</text><text x="410.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sin permiso libre,</text><text x="410.0" y="268" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">la tarea espera</text><text x="410.0" y="310" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">Semaphore(k)</text><text x="410.0" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await libera el permiso: no</text><rect x="550" y="96" width="240" height="280" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="670.0" y="128" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Pool</text><text x="670.0" y="154" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">qué conexión usas</text><line x1="570.0" y1="170.0" x2="770.0" y2="170.0" stroke="#4a7a63" stroke-width="1"/><text x="670.0" y="196" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">guarda conexiones reales</text><text x="670.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">abre, presta, recupera,</text><text x="670.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cierra y reemplaza rotas</text><text x="670.0" y="268" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sin conexión libre, espera</text><text x="670.0" y="310" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">Limits(max_connections=5)</text><text x="670.0" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">await libera la conexión: no</text><rect x="810" y="96" width="240" height="280" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="930.0" y="128" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Servidor / BD</text><text x="930.0" y="154" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">quién ejecuta</text><line x1="830.0" y1="170.0" x2="1030.0" y2="170.0" stroke="#4a7a63" stroke-width="1"/><text x="930.0" y="196" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">recibe por la conexión</text><text x="930.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y ejecuta la petición</text><text x="930.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">servidor de la clase:</text><text x="930.0" y="268" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un hilo por conexión</text><text x="930.0" y="310" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">ThreadingHTTPServer</text><text x="930.0" y="342" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">otro proceso, otra máquina</text><rect x="30" y="398" width="1020" height="172" rx="10" fill="#16302a" stroke="#4a7a63" stroke-width="2"/><text x="50" y="424" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">una petición, de ida y de vuelta</text><circle cx="150.0" cy="462" r="16" fill="#7ef29d"/><text x="150.0" y="467" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="150.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">corre hasta su await</text><line x1="172.0" y1="462" x2="388.0" y2="462" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><circle cx="410.0" cy="462" r="16" fill="#ffc857"/><text x="410.0" y="467" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="410.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">acquire: toma permiso</text><line x1="432.0" y1="462" x2="648.0" y2="462" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><circle cx="670.0" cy="462" r="16" fill="#6fd8e8"/><text x="670.0" y="467" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">3</text><text x="670.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">get: toma una conexión</text><line x1="692.0" y1="462" x2="908.0" y2="462" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><circle cx="930.0" cy="462" r="16" fill="#c9a7ff"/><text x="930.0" y="467" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">4</text><text x="930.0" y="500" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ejecuta y responde</text><line x1="930.0" y1="520" x2="150.0" y2="520" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="540.0" y="550" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">5. vuelve la respuesta: put devuelve la conexión, release suelta el permiso, el loop reanuda la tarea</text><text x="540.0" y="606" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un pool ≈ semáforo + objetos reales + ciclo de vida; el event loop es opcional: un pool también sirve con hilos</text></svg>