<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Ciclo de vida de una conexión del pool en tres estados: sin abrir, libre en el pool y prestada en vuelo. Abrir cuesta TCP, TLS y autenticación. Prestar con get la entrega a una tarea; devolver con put la deja libre y se reutiliza sin abrir otra, eso es keep-alive. Se cierra si queda inactiva mucho tiempo o el servidor la cierra, y si se rompe en vuelo el pool la descarta y abre otra. Abajo: con 5 conexiones y 5 peticiones en vuelo, la petición 6 no puede usar ninguna; espera en la cola del pool y toma la primera que vuelve. HTTP/1.1 y una conexión de base de datos llevan una petición a la vez; HTTP/2 puede multiplexar varias."><rect x="0" y="0" width="1080" height="620" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Ciclo de una conexión del pool</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">se abre una vez, se presta y se devuelve muchas veces</text><rect x="40.0" y="170" width="200" height="72" rx="12" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="140" y="200" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">sin abrir</text><text x="140" y="224" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">o cerrada</text><rect x="440.0" y="170" width="200" height="72" rx="12" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="540" y="200" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">libre</text><text x="540" y="224" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">en el pool</text><rect x="840.0" y="170" width="200" height="72" rx="12" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="940" y="200" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">prestada</text><text x="940" y="224" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">en vuelo: 1 petición</text><path d="M 920 170 C 760 70, 320 70, 160 170" fill="none" stroke="#ff8a7a" stroke-width="2" marker-end="url(#fff8a7a)"/><text x="540" y="128" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">rota en vuelo: el pool la descarta y abre otra</text><line x1="244" y1="200.0" x2="436" y2="200.0" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="340" y="190.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">abrir</text><text x="340" y="220.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">TCP + TLS + auth</text><line x1="644" y1="200.0" x2="836" y2="200.0" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="740" y="190.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">prestar: get</text><text x="740" y="220.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">a una tarea</text><path d="M 940 242 C 900 312, 620 312, 580 244" fill="none" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="760" y="318" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">devolver: put</text><text x="760" y="338" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">se reutiliza (keep-alive)</text><path d="M 500 242 C 460 312, 180 312, 140 244" fill="none" stroke="#a7b8ad" stroke-width="2" marker-end="url(#fa7b8ad)"/><text x="320" y="318" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cerrar: inactiva mucho tiempo</text><text x="320" y="338" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">o el servidor la cerró</text><rect x="30" y="370" width="1020" height="160" rx="10" fill="#16302a" stroke="#4a7a63" stroke-width="2"/><text x="50" y="396" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">pool de 5 conexiones, 5 peticiones en vuelo:</text><rect x="50" y="414" width="200" height="60" rx="8" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="150" y="440" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">petición 6</text><text x="150" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">en la cola del pool</text><line x1="254" y1="444" x2="300" y2="444" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><rect x="306" y="414" width="134" height="60" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="373" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conexión 1</text><text x="373" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">prestada a p1</text><rect x="452" y="414" width="134" height="60" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="519" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conexión 2</text><text x="519" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">prestada a p2</text><rect x="598" y="414" width="134" height="60" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="665" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conexión 3</text><text x="665" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">prestada a p3</text><rect x="744" y="414" width="134" height="60" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="811" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conexión 4</text><text x="811" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">prestada a p4</text><rect x="890" y="414" width="134" height="60" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="957" y="440" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">conexión 5</text><text x="957" y="462" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">prestada a p5</text><text x="540.0" y="506" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ninguna de las 5 le sirve mientras siga en vuelo; en cuanto una vuelve (put), la petición 6 la toma</text><text x="540.0" y="566" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">HTTP/1.1 y una conexión de BD llevan una petición a la vez; HTTP/2 puede multiplexar varias</text><text x="540.0" y="592" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">await no devuelve la conexión: sigue prestada hasta el put</text></svg>