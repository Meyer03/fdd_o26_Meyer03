<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Ley de Little: L igual a lambda por W, peticiones en vuelo igual a throughput por latencia. Un tubo con 32 peticiones en vuelo, cada una dentro 0.2 s, entran y salen 160 por segundo: 32 = 160 por 0.2. Debajo, 500 llamadas con 32 en vuelo son 16 tandas de 0.2 s: cota de 3.2 s contra 3.32 s medidos, 151 por segundo. En serie, 20 llamadas con L = 1 dan 5 por segundo; medido 20 entre 4.04 s, 4.95 por segundo. Despejando, W = 32 / 151, unos 0.212 s: 12 ms de sobrecosto. El servidor de la clase con 151 por segundo y 0.2 s tiene unos 30 hilos ocupados; si W sube a 2 s, unos 300."><rect x="0" y="0" width="1080" height="620" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Ley de Little: en vuelo = throughput × latencia</text><text x="540.0" y="74" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" text-anchor="middle">L = lambda · W</text><text x="540.0" y="98" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">L: peticiones en vuelo · lambda: peticiones por segundo · W: segundos que pasa cada una dentro</text><line x1="40" y1="172" x2="184" y2="172" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="112" y="160" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">entran 160/s</text><rect x="190" y="122" width="700" height="100" rx="14" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><circle cx="228" cy="152" r="12" fill="#6fd8e8"/><circle cx="270" cy="152" r="12" fill="#6fd8e8"/><circle cx="312" cy="152" r="12" fill="#6fd8e8"/><circle cx="354" cy="152" r="12" fill="#6fd8e8"/><circle cx="396" cy="152" r="12" fill="#6fd8e8"/><circle cx="438" cy="152" r="12" fill="#6fd8e8"/><circle cx="480" cy="152" r="12" fill="#6fd8e8"/><circle cx="522" cy="152" r="12" fill="#6fd8e8"/><circle cx="564" cy="152" r="12" fill="#6fd8e8"/><circle cx="606" cy="152" r="12" fill="#6fd8e8"/><circle cx="648" cy="152" r="12" fill="#6fd8e8"/><circle cx="690" cy="152" r="12" fill="#6fd8e8"/><circle cx="732" cy="152" r="12" fill="#6fd8e8"/><circle cx="774" cy="152" r="12" fill="#6fd8e8"/><circle cx="816" cy="152" r="12" fill="#6fd8e8"/><circle cx="858" cy="152" r="12" fill="#6fd8e8"/><circle cx="228" cy="192" r="12" fill="#6fd8e8"/><circle cx="270" cy="192" r="12" fil