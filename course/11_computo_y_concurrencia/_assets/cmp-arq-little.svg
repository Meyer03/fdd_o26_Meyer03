al" text-anchor="middle">3.5</text><text x="174" y="394" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (s)</text><line x1="967.1" y1="306.0" x2="967.1" y2="370.0" stroke="#ffc857" stroke-width="2" stroke-dasharray="6 4"/><text x="961.1428571428571" y="300" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">cota 16 tandas × 0.2 s = 3.2 s</text><line x1="996.3" y1="316.0" x2="996.3" y2="400.0" stroke="#ff8a7a" stroke-width="2"/><text x="1000.2857142857143" y="418" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">medido 3.32 s</text><text x="60" y="466" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">en serie, 20 llamadas: L = 1, W ≈ 0.2 s → 5/s; medido 20 / 4.04 s = 4.95/s</text><text x="60" y="494" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">500 llamadas con 32 en vuelo: 32 / 0.2 s = 160/s → cota 3.2 s; medido 3.32 s = 151/s</text><text x="60" y="522" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">latencia despejada: W = L / lambda = 32 / 151 ≈ 0.212 s, 12 ms de sobrecosto por llamada</text><text x="60" y="550" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">servidor de la clase: 151/s × 0.2 s ≈ 30 hilos ocupados; si W sube a 2 s, ≈ 300 hilos</text><text x="540.0" y="598" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">mediciones de una corrida en una máquina de 8 CPU lógicas; la cota supone W = 0.2 s exactos y sin sobrecosto</text></svg>