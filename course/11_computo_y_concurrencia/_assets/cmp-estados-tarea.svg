<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-label="Diagrama de estados de una tarea. Nueva pasa a lista cuando se crea y se agenda. De lista pasa a ejecutando cuando le dan la CPU, y de ejecutando puede volver a lista si pierde el turno. De ejecutando pasa a esperando cuando pide red, disco o un sleep con await, y de esperando vuelve a lista cuando llega el dato o vence el temporizador. De ejecutando pasa a terminada con return. Cada estado lleva la muestra de su relleno en la Gantt: ejecuta relleno, espera contorno, lista rayado."><rect x="0" y="0" width="1080" height="530" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Los estados de una tarea: quién avanza, quién espera y quién no tiene turno</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">una tarea vive en uno solo a la vez; la Gantt pinta cada estado con su relleno</text><rect x="30.0" y="142.0" width="150" height="76" rx="12" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="105" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">nueva</text><text x="105" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aún sin agendar</text><rect x="275.0" y="142.0" width="170" height="76" rx="12" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="360" y="172" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">lista</text><rect x="316.0" y="188.0" width="30.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><text x="354" y="202" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">ready</text><rect x="565.0" y="142.0" width="190" height="76" rx="12" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="660" y="172" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">ejecutando</text><rect x="616.0" y="188.0" width="30.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="654" y="202" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">exec</text><rect x="880.0" y="142.0" width="150" height="76" rx="12" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="955" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">terminada</text><text x="955" y="202" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">end: fin de la vida</text><rect x="410.0" y="342.0" width="200" height="76" rx="12" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="510" y="372" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">esperando</text><rect x="466.0" y="388.0" width="30.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="504" y="402" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="start">wait</text><line x1="180" y1="180" x2="275" y2="180" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="228" y="170" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">se agenda</text><line x1="445" y1="166" x2="565" y2="166" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="505" y="156" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">le dan CPU</text><line x1="565" y1="194" x2="445" y2="194" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="505" y="216" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">pierde el turno</text><line x1="755" y1="180" x2="880" y2="180" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="818" y="170" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">return</text><line x1="650" y1="218" x2="575" y2="342" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><text x="628" y="290" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">await: pide red,</text><text x="628" y="308" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">disco o un sleep</text><line x1="445" y1="342" x2="370" y2="218" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="392" y="290" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">llega el dato o</text><text x="392" y="308" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">vence el timer</text><rect x="40" y="446" width="1000" height="66" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="472" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">La prueba: si ahora le das una CPU libre, ¿avanza? Sí: está lista. No: está esperando.</text><text x="540.0" y="496" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Pierde el turno por el GIL o el sistema; en asyncio solo cede en un await, nunca a la fuerza.</text></svg>