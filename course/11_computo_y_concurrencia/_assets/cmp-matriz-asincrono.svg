<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Matriz de dos por dos. Filas: modelo de escritura bloqueante, con requests o time.sleep, o asincrono, con async y await. Columnas: la traza no es concurrente o si lo es. Bloqueante y no concurrente: secuencial, 720 ms. Bloqueante y concurrente: hilos, 280 ms. Asincrono y no concurrente: await uno tras otro, 720 ms. Asincrono y concurrente: gather en un hilo, 280 ms. Las cuatro celdas existen: asincrono describe el codigo, concurrente describe la traza."><rect x="0" y="0" width="1080" height="620" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Asíncrono y concurrente son dos preguntas distintas</text><text x="670" y="88" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">¿la traza es concurrente? (alguna vida se solapa)</text><text x="495.0" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">no</text><text x="845.0" y="120" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">sí</text><text x="170" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">¿cómo está escrito</text><text x="170" y="134" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el código?</text><text x="300" y="217.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">bloqueante</text><text x="300" y="239.0" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">requests, time.sleep</text><text x="300" y="387.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">asíncrono</text><text x="300" y="409.0" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">async def, await</text><rect x="326" y="142" width="338" height="158" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="495.0" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">secuencial</text><text x="495.0" y="216" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un for: una llamada</text><text x="495.0" y="238" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tras otra</text><text x="495.0" y="280" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 tareas: 720 ms</text><rect x="676" y="142" width="338" height="158" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="845.0" y="182" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">hilos</text><text x="845.0" y="216" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">ThreadPoolExecutor:</text><text x="845.0" y="238" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el sistema reparte el turno</text><text x="845.0" y="280" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 tareas: 280 ms</text><rect x="326" y="312" width="338" height="158" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="495.0" y="352" fill="#ffc857" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">await en serie</text><text x="495.0" y="386" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">async en el código,</text><text x="495.0" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un await tras otro</text><text x="495.0" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 tareas: 720 ms</text><rect x="676" y="312" width="338" height="158" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="845.0" y="352" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">gather</text><text x="845.0" y="386" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un hilo; quien espera</text><text x="845.0" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cede con await</text><text x="845.0" y="450" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 tareas: 280 ms</text><rect x="60" y="498" width="960" height="100" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="528" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Asíncrono: la llamada regresa antes del resultado y quien espera cede el hilo.</text><text x="540.0" y="554" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Es propiedad del código. Concurrente es propiedad de la traza: se ve en el Gantt.</text><text x="540.0" y="578" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Escribir async no basta: sin gather ni create_task, las esperas no se solapan.</text></svg>