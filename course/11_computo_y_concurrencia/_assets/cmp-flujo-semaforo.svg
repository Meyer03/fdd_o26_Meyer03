<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Diagrama de flujo de async with sem con un Semaphore de k permisos. La tarea llega y pregunta si el contador es mayor que cero. Si si, resta uno y entra; dentro hace su await de la peticion sin soltar el permiso; al salir suma uno y, si hay cola, despierta a la primera. Si no, se forma en la cola de espera FIFO hasta que la despiertan. A la derecha, un ejemplo con k igual a 3: el contador baja a 0 y T4 espera en la cola hasta que T1 sale."><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Semaphore(k): un contador de permisos y una cola de espera</text><text x="540.0" y="72" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">async with sem:  await cliente.get(url)</text><rect x="30" y="120" width="190" height="64" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="125.0" y="146" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">la tarea llega</text><text x="125.0" y="168" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">async with sem:</text><line x1="220" y1="152" x2="288" y2="152" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="290" y="120" width="200" height="64" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="390.0" y="158.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">¿contador &gt; 0?</text><line x1="490" y1="152" x2="568" y2="152" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="529" y="142" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">sí</text><rect x="570" y="120" width="250" height="64" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="695.0" y="146" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">entra</text><text x="695.0" y="168" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">contador −= 1 (toma un permiso)</text><line x1="695" y1="184" x2="695" y2="238" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="570" y="240" width="250" height="64" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="695.0" y="266" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">dentro: await la petición</text><text x="695.0" y="288" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el permiso sigue tomado</text><line x1="695" y1="304" x2="695" y2="358" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="570" y="360" width="250" height="84" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="695.0" y="386" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">sale del bloque</text><text x="695.0" y="408" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">contador += 1 y despierta</text><text x="695" y="428" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">a la primera de la cola</text><line x1="350" y1="184" x2="350" y2="268" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="340" y="232" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">no</text><rect x="260" y="270" width="250" height="100" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="385" y="294" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">cola de espera (FIFO)</text><rect x="300.0" y="308.0" width="50.0" height="26" rx="3" fill="#141b20" stroke="#ffc857" stroke-width="2" stroke-dasharray="2 3"/><text x="325" y="326" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T4</text><rect x="360.0" y="308.0" width="50.0" height="26" rx="3" fill="#141b20" stroke="#ffc857" stroke-width="2" stroke-dasharray="2 3"/><text x="385" y="326" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T5</text><rect x="420.0" y="308.0" width="50.0" height="26" rx="3" fill="#141b20" stroke="#ffc857" stroke-width="2" stroke-dasharray="2 3"/><text x="445" y="326" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T6</text><text x="385" y="358" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">esperan permiso, sin CPU</text><line x1="440" y1="270" x2="440" y2="186" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><text x="450" y="232" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la despiertan</text><line x1="570" y1="396" x2="512" y2="352" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="860" y="110" width="190" height="330" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="955" y="136" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">ejemplo: k = 3</text><text x="876" y="172" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">T1 entra</text><text x="1034" y="172" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">3 → 2</text><text x="876" y="216" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">T2 entra</text><text x="1034" y="216" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">2 → 1</text><text x="876" y="260" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">T3 entra</text><text x="1034" y="260" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">1 → 0</text><text x="876" y="304" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">T4 llega</text><text x="1034" y="304" fill="#ffc857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">cola [T4]</text><text x="876" y="348" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">T1 sale</text><text x="1034" y="348" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">T4 entra</text><text x="876" y="392" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">contador</text><text x="1034" y="392" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">sigue en 0</text><rect x="30" y="462" width="1020" height="76" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="490" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">El semáforo solo cuenta permisos: no guarda conexiones ni ningún otro objeto.</text><text x="540.0" y="516" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Un await dentro del bloque suelta el hilo del loop, no el permiso: sigue tomado hasta salir.</text></svg>