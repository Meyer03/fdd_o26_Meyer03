<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="426" viewBox="0 0 1080 426" role="img" aria-label="Diagrama de Gantt con eje de tiempo en milisegundos de 0 a 800. Las mismas tres tareas, una por hilo. Las tres esperas de 200 ms se solapan. La ejecucion se turna por el GIL: el hilo 2 queda listo sin turno, en rayado, de 0 a 20 ms y el hilo 3 de 0 a 40 ms, porque solo un hilo ejecuta Python a la vez. La fila de CPU nunca tiene dos tramos al mismo tiempo. Total 280 ms contra 720 del secuencial."><rect x="0" y="0" width="1080" height="426" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Hilos: las esperas se solapan, la ejecución se turna por el GIL</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las mismas 3 tareas: ejecuta 20 ms, espera 200 ms la red, ejecuta 20 ms</text><line x1="190.0" y1="106.0" x2="190.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="296.2" y1="106.0" x2="296.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="402.5" y1="106.0" x2="402.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="508.8" y1="106.0" x2="508.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="106.0" x2="615.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="721.2" y1="106.0" x2="721.2" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="827.5" y1="106.0" x2="827.5" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="933.8" y1="106.0" x2="933.8" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="106.0" x2="1040.0" y2="302.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="130.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">hilo 1</text><rect x="190.0" y="112.0" width="21.2" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="211.2" y="112.0" width="212.5" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke