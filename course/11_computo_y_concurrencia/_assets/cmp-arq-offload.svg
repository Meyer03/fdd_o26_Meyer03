<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-label="Arquitectura de offload. Los clientes llegan a un proceso principal con un event loop en un hilo, que atiende las conexiones y nunca calcula: el manejador hace await de loop.run_in_executor. El trabajo pasa por una cola interna, con los argumentos serializados con pickle, a un pool de P procesos, cada uno con su GIL y su CPU. El resultado vuelve serializado, completa un Future y la corrutina se reanuda. Cuántos procesos: min(k, P). Cuesta copiar datos entre procesos. Sí para cálculo de decenas de milisegundos o más; no para microsegundos. Abajo, la versión en varias máquinas: API, cola externa como Redis o RabbitMQ, workers y almacén de resultados."><rect x="0" y="0" width="1080" height="660" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Offload: el loop atiende, un pool de procesos calcula</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">el manejador no calcula: manda el trabajo por una cola a P procesos y espera el resultado con await</text><rect x="40" y="150" width="110" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="95" y="178" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 1</text><line x1="152" y1="172" x2="216" y2="172" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="40" y="220" width="110" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="95" y="248" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 2</text><line x1="152" y1="242" x2="216" y2="242" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="40" y="290" width="110" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="95" y="318" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 3</text><line x1="152" y1="312" x2="216" y2="312" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="220" y="120" width="250" height="240" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="345" y="150" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">proceso principal</text><text x="345" y="174" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">event loop · 1 hilo</text><text x="345" y="212" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">atiende miles de conexiones</text><text x="345" y="236" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el manejador hace</text><text x="345" y="262" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">await loop.run_in_executor(</text><text x="345" y="284" fill="#7ef29d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">    pool, calcula, datos)</text><text x="345" y="324" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">nunca calcula dentro</text><line x1="472" y1="200" x2="526" y2="200" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="530" y="150" width="120" height="100" rx="8" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><rect x="545.0" y="162.0" width="90.0" height="15" rx="3" fill="#16302a" stroke="#6fd8e8" stroke-width="1"/><rect x="545.0" y="183.0" width="90.0" height="15" rx="3" fill="#16302a" stroke="#6fd8e8" stroke-width="1"/><rect x="545.0" y="204.0" width="90.0" height="15" rx="3" fill="#16302a" stroke="#6fd8e8" stroke-width="1"/><rect x="545.0" y="225.0" width="90.0" height="15" rx="3" fill="#16302a" stroke="#6fd8e8" stroke-width="1"/><text x="590" y="272" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">cola interna</text><text x="590" y="294" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">argumentos</text><text x="590" y="312" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">en pickle</text><line x1="652" y1="200" x2="696" y2="200" stroke="#6fd8e8" stroke-width="2" marker-end="url(#f6fd8e8)"/><rect x="700" y="120" width="340" height="240" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="870" y="150" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">pool de P procesos</text><text x="870" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">trabajadores reutilizables</text><rect x="715" y="190" width="150" height="70" rx="8" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="790" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">proceso 1</text><text x="790" y="242" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL · su CPU</text><rect x="875" y="190" width="150" height="70" rx="8" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="950" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">proceso 2</text><text x="950" y="242" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL · su CPU</text><rect x="715" y="274" width="150" height="70" rx="8" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="790" y="304" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">proceso 3</text><text x="790" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL · su CPU</text><rect x="875" y="274" width="150" height="70" rx="8" fill="#0b0f12" stroke="#c9a7ff" stroke-width="2"/><text x="950" y="304" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">proceso 4</text><text x="950" y="326" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL · su CPU</text><line x1="870.0" y1="362.0" x2="870.0" y2="396.0" stroke="#ffc857" stroke-width="2"/><line x1="870.0" y1="396.0" x2="345.0" y2="396.0" stroke="#ffc857" stroke-width="2"/><line x1="345" y1="396" x2="345" y2="364" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="607" y="420" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">resultado en pickle → Future → la corrutina se reanuda</text><text x="40" y="460" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">cuántos procesos: min(k, P), con k tareas de cálculo listas y P CPU lógicas</text><text x="40" y="486" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">qué cuesta: copiar argumentos y resultados entre procesos (IPC); la función vive en un módulo, no en una lambda</text><text x="40" y="512" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sí: cálculo de decenas de ms o más en un servicio async  ·  no: cálculo de microsegundos (serializar cuesta más)</text><rect x="30" y="534" width="1020" height="106" rx="10" fill="#16302a" stroke="#4a7a63" stroke-width="2"/><text x="50" y="560" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">en varias máquinas, el mismo patrón:</text><rect x="60" y="576" width="120" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="120.0" y="604" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">API</text><line x1="184" y1="598" x2="226" y2="598" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="230" y="576" width="250" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="355.0" y="604" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cola: Redis o RabbitMQ</text><line x1="484" y1="598" x2="526" y2="598" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="530" y="576" width="180" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="620.0" y="604" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">workers (Celery)</text><line x1="714" y1="598" x2="756" y2="598" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="760" y="576" width="270" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="895.0" y="604" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">almacén de resultados</text></svg>