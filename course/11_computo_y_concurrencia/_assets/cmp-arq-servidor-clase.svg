<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-label="Arquitectura del servidor de la clase, un ThreadingHTTPServer en el puerto 8026. A la izquierda n clientes, cada uno con su conexion TCP. Llegan a un socket que escucha con una cola listen de 1024 conexiones pendientes, que por omision serian 5. El hilo principal hace accept en serve_forever y crea un hilo por conexion, sin tope. Todos los hilos comparten el diccionario de ventas y lo tocan solo dentro de with candado, un unico Lock: esa region critica corre de a un hilo."><rect x="0" y="0" width="1080" height="600" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El servidor de la clase: un hilo por conexión y un solo candado</text><text x="540.0" y="70" fill="#a7b8ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">servidor.py · ThreadingHTTPServer · puerto 8026</text><text x="100" y="106" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">clientes</text><rect x="30" y="120" width="140" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="100" y="147" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 1</text><line x1="170" y1="142" x2="220" y2="142" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="30" y="178" width="140" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="100" y="205" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 2</text><line x1="170" y1="200" x2="220" y2="200" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="30" y="236" width="140" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="100" y="263" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente 3</text><line x1="170" y1="258" x2="220" y2="258" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><text x="100" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">…</text><rect x="30" y="330" width="140" height="44" rx="8" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="100" y="357" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cliente n</text><line x1="170" y1="352" x2="220" y2="352" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><text x="100" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una conexión TCP</text><text x="100" y="418" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cada uno</text><rect x="222" y="110" width="216" height="270" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="330" y="136" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">socket que escucha</text><rect x="285.0" y="156.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><rect x="285.0" y="186.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><rect x="285.0" y="216.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><rect x="285.0" y="246.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><rect x="285.0" y="276.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><rect x="285.0" y="306.0" width="90.0" height="22" rx="4" fill="#0b0f12" stroke="#6fd8e8" stroke-width="1.2"/><text x="330" y="172" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">pendiente</text><text x="330" y="352" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cola listen</text><text x="330" y="372" fill="#6fd8e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">request_queue_size = 1024</text><text x="330" y="400" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">por omisión serían 5</text><line x1="438" y1="245" x2="470" y2="245" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><rect x="472" y="200" width="170" height="90" rx="10" fill="#141b20" stroke="#ffc857" stroke-width="2"/><text x="557" y="226" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">hilo principal</text><text x="557" y="252" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">serve_forever()</text><text x="557" y="274" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">accept()</text><text x="790" y="106" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">un hilo por conexión, sin tope</text><line x1="642" y1="245" x2="718" y2="142" stroke="#ffc857" stroke-width="1.6" marker-end="url(#fffc857)"/><rect x="720" y="120" width="140" height="44" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="732" y="147" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">hilo 1</text><text x="850" y="147" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">do_GET</text><line x1="860" y1="142" x2="918" y2="236" stroke="#c9a7ff" stroke-width="1.4" marker-end="url(#fc9a7ff)"/><line x1="642" y1="245" x2="718" y2="200" stroke="#ffc857" stroke-width="1.6" marker-end="url(#fffc857)"/><rect x="720" y="178" width="140" height="44" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="732" y="205" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">hilo 2</text><text x="850" y="205" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">do_GET</text><line x1="860" y1="200" x2="918" y2="236" stroke="#c9a7ff" stroke-width="1.4" marker-end="url(#fc9a7ff)"/><line x1="642" y1="245" x2="718" y2="258" stroke="#ffc857" stroke-width="1.6" marker-end="url(#fffc857)"/><rect x="720" y="236" width="140" height="44" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="732" y="263" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">hilo 3</text><text x="850" y="263" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">do_GET</text><line x1="860" y1="258" x2="918" y2="236" stroke="#c9a7ff" stroke-width="1.4" marker-end="url(#fc9a7ff)"/><text x="790" y="300" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">…</text><line x1="642" y1="245" x2="718" y2="352" stroke="#ffc857" stroke-width="1.6" marker-end="url(#fffc857)"/><rect x="720" y="330" width="140" height="44" rx="8" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="732" y="357" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">hilo n</text><text x="850" y="357" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="end">do_GET</text><line x1="860" y1="352" x2="918" y2="236" stroke="#c9a7ff" stroke-width="1.4" marker-end="url(#fc9a7ff)"/><text x="600" y="330" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">crea uno</text><text x="600" y="348" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">por conexión</text><text x="985" y="170" fill="#c9a7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">with candado:</text><rect x="920" y="186" width="130" height="100" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="985" y="214" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">candado</text><text x="985" y="240" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">Lock()</text><text x="985" y="266" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">uno solo</text><line x1="985" y1="286" x2="985" y2="318" stroke="#c9a7ff" stroke-width="2" marker-end="url(#fc9a7ff)"/><rect x="920" y="320" width="130" height="60" rx="10" fill="#141b20" stroke="#4a7a63" stroke-width="2"/><text x="985" y="346" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="normal" text-anchor="middle">ventas</text><text x="985" y="368" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">dict compartido</text><rect x="30" y="446" width="1020" height="130" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="474" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Conexiones abiertas del cliente = hilos ocupados del servidor.</text><text x="540.0" y="502" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">?lento=0.2 duerme fuera del candado: las esperas de varios hilos se solapan.</text><text x="540.0" y="530" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Dentro de with candado entra un hilo a la vez: región crítica, serialización deliberada.</text><text x="540.0" y="558" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Memoria compartida: todos los hilos ven el mismo dict; por eso el candado.</text></svg>