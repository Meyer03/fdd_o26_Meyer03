<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="624" viewBox="0 0 1080 624" role="img" aria-label="Dos diagramas de Gantt, esquema con eje de 0 a 2500 ms. Seis tareas y un pool de 3 conexiones a la base de datos; cada tarea consulta la BD 100 ms, llama a una API lenta 1000 ms y escribe en la BD 100 ms. Arriba, retener: cada tarea guarda su conexión durante la llamada lenta, cada conexión pasa 1000 de cada 1200 ms sin usarse y las tareas 4 a 6 esperan una ola entera: total 2400 ms. Abajo, soltar: la tarea devuelve la conexión antes de llamar a la API y toma otra para escribir; las seis esperas a la API se solapan sin ocupar conexión: total 1300 ms."><rect x="0" y="0" width="1080" height="624" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0