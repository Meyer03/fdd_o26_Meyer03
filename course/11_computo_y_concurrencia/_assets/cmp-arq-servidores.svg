<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Tres modelos de servidor lado a lado. Hilo por conexión: accept entrega cada conexión a un hilo, todos tocan un estado con un Lock; cuesta un hilo con su pila por conexión; sí para pocas conexiones y código bloqueante, no para miles de conexiones ociosas; ejemplo, el ThreadingHTTPServer de la clase. Event loop: un selector vigila los sockets, las listas pasan a una cola y un hilo las ejecuta una a la vez; sí para miles de conexiones que esperan, no para manejadores que calculan o bloquean; nginx, Node.js, Uvicorn. Prefork: un maestro crea K procesos que aceptan del mismo socket, cada uno con su GIL; sí para cálculo por petición y aislar fallos, no para estado compartido en memoria; Gunicorn, PostgreSQL. Abajo, el híbrido: un event loop por proceso."><rect x="0" y="0" width="1080" height="560" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Tres formas de atender muchas conexiones</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">qué consume cada conexión decide cuántas aguantas</text><rect x="30" y="92" width="330" height="388" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="195.0" y="122" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">hilo por conexión</text><text x="195.0" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">por conexión: un hilo con su pila</text><text x="48" y="400" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí: pocas conexiones, código bloqueante</text><text x="48" y="426" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no: miles de conexiones ociosas</text><text x="48" y="456" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">real: ThreadingHTTPServer, Apache</text><rect x="375" y="92" width="330" height="388" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="540.0" y="122" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">event loop</text><text x="540.0" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">por conexión: un socket y una corrutina</text><text x="393" y="400" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí: miles de conexiones que esperan</text><text x="393" y="426" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no: manejadores que calculan o bloquean</text><text x="393" y="456" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">real: nginx, Node.js, Uvicorn</text><rect x="720" y="92" width="330" height="388" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="885.0" y="122" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">prefork / multiproceso</text><text x="885.0" y="146" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">por worker: un proceso y su memoria</text><text x="738" y="400" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí: cálculo por petición, aislar fallos</text><text x="738" y="426" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no: estado en memoria compartido</text><text x="738" y="456" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">real: Gunicorn, PostgreSQL</text><rect x="125" y="168" width="140" height="34" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="195" y="190" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">accept</text><line x1="153.0" y1="204" x2="90" y2="232" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="45" y="236" width="90" height="34" rx="6" fill="#16302a" stroke="#6fd8e8" stroke-width="2"/><text x="90" y="258" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">hilo 1</text><line x1="90" y1="272" x2="153.0" y2="296" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><line x1="195.0" y1="204" x2="195" y2="232" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="150" y="236" width="90" height="34" rx="6" fill="#16302a" stroke="#6fd8e8" stroke-width="2"/><text x="195" y="258" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">hilo 2</text><line x1="195" y1="272" x2="195.0" y2="296" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><line x1="237.0" y1="204" x2="300" y2="232" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="255" y="236" width="90" height="34" rx="6" fill="#16302a" stroke="#6fd8e8" stroke-width="2"/><text x="300" y="258" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">hilo 3</text><line x1="300" y1="272" x2="237.0" y2="296" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="105" y="300" width="180" height="34" rx="6" fill="#0b0f12" stroke="#ffc857" stroke-width="2"/><text x="195" y="322" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">estado + un Lock</text><text x="195" y="362" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sin tope: un pico abre miles</text><rect x="430" y="168" width="220" height="34" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="540" y="190" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">selector: sockets en espera</text><line x1="540" y1="204" x2="540" y2="232" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="430" y="236" width="220" height="34" rx="6" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="540" y="258" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cola de listas: A · B · C</text><line x1="540" y1="272" x2="540" y2="296" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="430" y="300" width="220" height="34" rx="6" fill="#0b0f12" stroke="#7ef29d" stroke-width="2"/><text x="540" y="322" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1 hilo ejecuta a una a la vez</text><line x1="428.0" y1="317.0" x2="394.0" y2="317.0" stroke="#ffc857" stroke-width="1.6"/><line x1="394.0" y1="317.0" x2="394.0" y2="185.0" stroke="#ffc857" stroke-width="1.6"/><line x1="394" y1="185" x2="426" y2="185" stroke="#ffc857" stroke-width="1.6" marker-end="url(#fffc857)"/><text x="399" y="224" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">await</text><text x="540" y="362" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">algo bloqueante congela a todas</text><rect x="815" y="168" width="140" height="34" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="885" y="190" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">maestro</text><line x1="843.0" y1="204" x2="780" y2="230" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="733" y="234" width="94" height="44" rx="6" fill="#16302a" stroke="#c9a7ff" stroke-width="2"/><text x="780" y="253" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">proceso 1</text><text x="780" y="271" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL</text><line x1="843.0" y1="300" x2="780" y2="282" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><line x1="885.0" y1="204" x2="885" y2="230" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="838" y="234" width="94" height="44" rx="6" fill="#16302a" stroke="#c9a7ff" stroke-width="2"/><text x="885" y="253" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">proceso 2</text><text x="885" y="271" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL</text><line x1="885.0" y1="300" x2="885" y2="282" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><line x1="927.0" y1="204" x2="990" y2="230" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="943" y="234" width="94" height="44" rx="6" fill="#16302a" stroke="#c9a7ff" stroke-width="2"/><text x="990" y="253" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">proceso 3</text><text x="990" y="271" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">su GIL</text><line x1="927.0" y1="300" x2="990" y2="282" stroke="#4a7a63" stroke-width="1.6" marker-end="url(#f4a7a63)"/><rect x="785" y="300" width="200" height="34" rx="6" fill="#0b0f12" stroke="#4a7a63" stroke-width="2"/><text x="885" y="322" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">socket compartido</text><text x="885" y="362" fill="#ff8a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">K procesos × memoria de cada uno</text><text x="540.0" y="520" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">híbrido en producción: K procesos, cada uno con su event loop (Gunicorn con UvicornWorker; nginx)</text></svg>