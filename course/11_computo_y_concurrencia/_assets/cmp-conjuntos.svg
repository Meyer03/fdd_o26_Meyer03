<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-label="Diagrama de conjuntos de trazas de un mismo grupo de tareas. A la izquierda, secuencial: ningun par de vidas se solapa, con una mini Gantt de T1 y luego T2. A la derecha, concurrente: algun par de vidas se solapa, con T1 y T2 intercaladas en una CPU como hilos con GIL o asyncio. Dentro de concurrente, la region paralelo: dos tareas ejecutan en el mismo instante en dos CPU, como procesos. Secuencial y concurrente no se tocan; paralelo implica concurrente."><rect x="0" y="0" width="1080" height="580" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><defs><pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" y="0" width="8" height="8" fill="#141b20"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a7ff" stroke-width="3"/></pattern></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Secuencial o concurrente; lo paralelo es una parte de lo concurrente</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las mismas tareas, la misma granularidad: cada traza cae en una sola región</text><rect x="30" y="92" width="1020" height="352" rx="14" fill="none" stroke="#4a7a63" stroke-width="2"/><text x="50" y="116" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">todas las trazas posibles</text><rect x="50" y="132" width="330" height="296" rx="12" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="215" y="168" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">secuencial</text><text x="215" y="194" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ningún par de vidas se solapa</text><text x="92" y="243" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">T1</text><rect x="100.0" y="230.0" width="22.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="122.0" y="230.0" width="88.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="210.0" y="230.0" width="22.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="92" y="265" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">T2</text><rect x="232.0" y="252.0" width="22.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="254.0" y="252.0" width="88.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="342.0" y="252.0" width="22.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="215" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un for con requests</text><text x="215" y="342" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">await uno tras otro</text><rect x="410" y="132" width="620" height="296" rx="12" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="560" y="168" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">concurrente</text><text x="560" y="194" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">algún par de vidas se solapa</text><text x="462" y="243" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">T1</text><rect x="470.0" y="230.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="494.0" y="230.0" width="96.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="590.0" y="230.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="462" y="265" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">T2</text><rect x="470.0" y="252.0" width="24.0" height="16" rx="3" fill="url(#rayado)" stroke="#c9a7ff" stroke-width="1.4"/><rect x="494.0" y="252.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="518.0" y="252.0" width="96.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="614.0" y="252.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="560" y="320" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">hilos con GIL</text><text x="560" y="342" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">asyncio con gather</text><text x="560" y="372" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">se turnan una CPU</text><rect x="720" y="152" width="290" height="256" rx="12" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="865" y="186" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">paralelo</text><text x="865" y="210" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">dos tareas ejecutan</text><text x="865" y="228" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">en el mismo instante</text><text x="812" y="263" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">CPU 1</text><rect x="820.0" y="250.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="844.0" y="250.0" width="96.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="940.0" y="250.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="812" y="285" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">CPU 2</text><rect x="820.0" y="272.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="844.0" y="272.0" width="96.0" height="16" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><rect x="940.0" y="272.0" width="24.0" height="16" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="865" y="330" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">procesos en 2 o más CPU</text><text x="865" y="352" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una CPU por tarea</text><rect x="30" y="462" width="1020" height="96" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="540.0" y="490" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Paralelo ⇒ concurrente: si T1 y T2 ejecutan en el mismo t, ese t está en las dos vidas.</text><text x="540.0" y="516" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">«Paralelo sin concurrente» no existe con las mismas tareas: es un cambio de granularidad.</text><text x="540.0" y="540" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Asíncrono no es una región de este dibujo: es cómo cede el hilo quien espera.</text></svg>