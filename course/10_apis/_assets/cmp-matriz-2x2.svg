<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Matriz de dos por dos. Columnas: no paralelo, una sola CPU ejecuta a la vez; paralelo, varias CPU ejecutan en el mismo instante. Filas: no concurrente, una tarea en curso a la vez; concurrente, varias tareas en curso a la vez. Secuencial cae en no concurrente y no paralelo. Hilos de Python con GIL y asyncio caen en concurrente y no paralelo. Procesos caen en concurrente y paralelo. La celda paralelo sin concurrencia es una sola operacion repartida dentro de una libreria compilada. Asincrono no es una celda: es como se escribe la espera, con await."><rect x="0" y="0" width="1080" height="640" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Concurrente y paralelo son dos preguntas distintas</text><text x="660" y="88" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">¿varias CPU ejecutan en el mismo instante?</text><text x="480.0" y="116" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">no: no paralelo</text><text x="840.0" y="116" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">sí: paralelo</text><text x="150" y="112" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">¿varias tareas en curso</text><text x="150" y="130" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">a la vez?</text><text x="280" y="235.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">no: no concurrente</text><text x="280" y="435.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">sí: concurrente</text><rect x="306" y="136" width="348" height="188" rx="10" fill="#141b20" stroke="#a7b8ad" stroke-width="2"/><text x="480.0" y="182" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">secuencial</text><text x="480.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un for con una llamada</text><text x="480.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">tras otra</text><rect x="666" y="136" width="348" height="188" rx="10" fill="#141b20" stroke="#c9a7ff" stroke-width="2"/><text x="840.0" y="182" fill="#c9a7ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">una operación repartida</text><text x="840.0" y="220" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">dentro de una librería compilada</text><text x="840.0" y="244" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">(p. ej. NumPy multiplicando</text><text x="840.0" y="268" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">matrices grandes); rara de escribir</text><rect x="306" y="336" width="348" height="188" rx="10" fill="#141b20" stroke="#6fd8e8" stroke-width="2"/><text x="480.0" y="382" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">hilos  ·  asyncio</text><text x="480.0" y="420" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">varias esperas en curso,</text><text x="480.0" y="444" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">pero el GIL deja ejecutar</text><text x="480.0" y="468" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Python a uno a la vez</text><rect x="666" y="336" width="348" height="188" rx="10" fill="#141b20" stroke="#7ef29d" stroke-width="2"/><text x="840.0" y="382" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">procesos</text><text x="840.0" y="420" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">un intérprete y un GIL</text><text x="840.0" y="444" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">por proceso: cálculo</text><text x="840.0" y="468" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">simultáneo en varias CPU</text><rect x="300" y="552" width="720" height="64" rx="8" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="660" y="578" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Asíncrono no es una celda: es cómo se escribe la espera (await).</text><text x="660" y="602" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">asyncio lo usa para ser concurrente en un solo hilo.</text></svg>