<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Traza del event loop con tres corrutinas, eje de 0 a 300 ms. La corrutina 1 corre de 0 a 20 ms y cede en su await; el loop arranca la 2, que cede en 40 ms, y la 3, que cede en 60 ms. De 60 a 220 ms nadie esta listo y el loop espera eventos del sistema operativo sin gastar CPU. En 220 ms llega la respuesta de la 1 y el loop la reanuda; en 240 y 260 ms reanuda la 2 y la 3. Total 280 ms."><rect x="0" y="0" width="1080" height="620" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El event loop: quién corre, cuándo cede y cuándo vuelve</text><text x="540.0" y="70" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">las mismas 3 tareas: ejecuta 20 ms, espera 200 ms la red, ejecuta 20 ms</text><line x1="190.0" y1="100.0" x2="190.0" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="331.7" y1="100.0" x2="331.7" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="473.3" y1="100.0" x2="473.3" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="615.0" y1="100.0" x2="615.0" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="756.7" y1="100.0" x2="756.7" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="898.3" y1="100.0" x2="898.3" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><line x1="1040.0" y1="100.0" x2="1040.0" y2="388.0" stroke="#4a7a63" stroke-width="0.6" stroke-dasharray="2 6"/><text x="174" y="138.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">corrutina 1</text><rect x="190.0" y="120.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="246.7" y="120.0" width="566.7" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="530.0" y="138.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red</text><rect x="813.3" y="120.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="246.66666666666669" y1="148" x2="246.66666666666669" y2="166" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="252.66666666666669" y="166" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cede</text><line x1="813.3333333333334" y1="166" x2="813.3333333333334" y2="149" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="807.3333333333334" y="166" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">reanuda</text><text x="174" y="198.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">corrutina 2</text><rect x="190.0" y="180.0" width="56.7" height="26" rx="3" fill="none" stroke="#ffc857" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="246.7" y="180.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="303.3" y="180.0" width="566.7" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="586.6666666666667" y="198.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red</text><rect x="870.0" y="180.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="303.33333333333337" y1="208" x2="303.33333333333337" y2="226" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="309.33333333333337" y="226" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cede</text><line x1="870.0" y1="226" x2="870.0" y2="209" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="864.0" y="226" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">reanuda</text><text x="174" y="258.0" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">corrutina 3</text><rect x="190.0" y="240.0" width="113.3" height="26" rx="3" fill="none" stroke="#ffc857" stroke-width="1.6" stroke-dasharray="4 3"/><text x="246.66666666666669" y="258.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lista, sin turno</text><rect x="303.3" y="240.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><rect x="360.0" y="240.0" width="566.7" height="26" rx="3" fill="#141b20" stroke="#6fd8e8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="643.3333333333334" y="258.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">espera la red</text><rect x="926.7" y="240.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><line x1="360.0" y1="268" x2="360.0" y2="286" stroke="#ffc857" stroke-width="2" marker-end="url(#fffc857)"/><text x="366.0" y="286" fill="#ffc857" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cede</text><line x1="926.6666666666667" y1="286" x2="926.6666666666667" y2="269" stroke="#7ef29d" stroke-width="2" marker-end="url(#f7ef29d)"/><text x="920.6666666666667" y="286" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">reanuda</text><line x1="20.0" y1="298.0" x2="1040.0" y2="298.0" stroke="#4a7a63" stroke-width="1"/><text x="174" y="328.0" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">event loop</text><rect x="190.0" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="218.33333333333334" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c1</text><rect x="813.3" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="841.6666666666667" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c1</text><rect x="246.7" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="275.0" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c2</text><rect x="870.0" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="898.3333333333334" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c2</text><rect x="303.3" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="331.6666666666667" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c3</text><rect x="926.7" y="310.0" width="56.7" height="26" rx="3" fill="#7ef29d" stroke="none" stroke-width="0"/><text x="955.0000000000001" y="328.0" fill="#0b0f12" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">c3</text><rect x="360.0" y="313.0" width="453.3" height="20" rx="3" fill="none" stroke="#a7b8ad" stroke-width="1.4" stroke-dasharray="3 3"/><text x="586.6666666666667" y="328.0" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">nadie listo: espera eventos del sistema, sin gastar CPU</text><line x1="190.0" y1="388.0" x2="1040.0" y2="388.0" stroke="#a7b8ad" stroke-width="1.4"/><line x1="190.0" y1="388.0" x2="190.0" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="190.0" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="331.7" y1="388.0" x2="331.7" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="331.6666666666667" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">50</text><line x1="473.3" y1="388.0" x2="473.3" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="473.33333333333337" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">100</text><line x1="615.0" y1="388.0" x2="615.0" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="615.0" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">150</text><line x1="756.7" y1="388.0" x2="756.7" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="756.6666666666667" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">200</text><line x1="898.3" y1="388.0" x2="898.3" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="898.3333333333334" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">250</text><line x1="1040.0" y1="388.0" x2="1040.0" y2="394.0" stroke="#a7b8ad" stroke-width="1.4"/><text x="1040.0" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">300</text><text x="174" y="412" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">tiempo (ms)</text><text x="60" y="460" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">1. 0 ms: el loop corre c1 hasta su await; c1 cede.</text><text x="60" y="490" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">2. 20 y 40 ms: corre c2, cede; corre c3, cede.</text><text x="60" y="520" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">3. 60 a 220 ms: las tres esperan la red; el loop duerme.</text><text x="560" y="460" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">4. 220 ms: llega la respuesta de c1; el loop la reanuda.</text><text x="560" y="490" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">5. 240 y 260 ms: reanuda c2 y c3.</text><text x="560" y="520" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">6. 280 ms: las tres terminaron; gather regresa.</text><text x="540.0" y="572" fill="#ffc857" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Una corrutina solo suelta el turno en un await: entre dos await nadie más corre.</text></svg>