<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Arbol de decision. Primera pregunta: el tiempo se va en esperar red o disco, o en calcular; se decide midiendo. Si espera: hay libreria async como httpx, entonces asyncio con gather y un Semaphore; si no, hilos con ThreadPoolExecutor. Si calcula: opera sobre arreglos o columnas de numeros, entonces vectoriza con NumPy o Polars; si no, cada pedazo es independiente y tarda mas que arrancar un proceso, entonces procesos con ProcessPoolExecutor hasta el numero de CPU; si no, secuencial y mejora el algoritmo."><rect x="0" y="0" width="1080" height="640" rx="16" fill="#0b0f12"/><defs><marker id="f4a7a63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a63"/></marker><marker id="f7ef29d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ef29d"/></marker><marker id="fffc857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffc857"/></marker><marker id="f6fd8e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6fd8e8"/></marker><marker id="fc9a7ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a7ff"/></marker><marker id="fff8a7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/></marker><marker id="fa7b8ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7b8ad"/></marker><marker id="fe8f0e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8f0e8"/></marker></defs><text x="540.0" y="42" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Elegir la estrategia: primero mide dónde se va el tiempo</text><rect x="280.0" y="78.0" width="520" height="64" rx="10" fill="#141b20" stroke="#e8f0e8" stroke-width="2"/><text x="540" y="106" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">¿El tiempo se va en esperar o en calcular?</text><text x="540" y="128" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">mídelo: tiempo de reloj contra tiempo de CPU</text><line x1="420" y1="142" x2="270" y2="214" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="335.0" y="174.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">espera (red, disco)</text><line x1="660" y1="142" x2="810" y2="214" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="745.0" y="174.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">calcula</text><rect x="70.0" y="212.0" width="400" height="64" rx="10" fill="#141b20" stroke="#e8f0e8" stroke-width="2"/><text x="270" y="240" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">¿La librería tiene versión async?</text><text x="270" y="262" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">httpx, asyncpg, aiofiles…</text><line x1="200" y1="276" x2="150" y2="400" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="165.0" y="334.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">sí</text><line x1="340" y1="276" x2="390" y2="400" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="375.0" y="334.0" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">no</text><rect x="50.0" y="404.0" width="200" height="92" rx="10" fill="#16302a" stroke="#6fd8e8" stroke-width="2"/><text x="150" y="434" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">asyncio</text><text x="150" y="458" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">gather + Semaphore</text><text x="150" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">miles de esperas, 1 hilo</text><rect x="290.0" y="404.0" width="200" height="92" rx="10" fill="#16302a" stroke="#6fd8e8" stroke-width="2"/><text x="390" y="434" fill="#6fd8e8" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">hilos</text><text x="390" y="458" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">ThreadPoolExecutor</text><text x="390" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">decenas o cientos</text><rect x="610.0" y="212.0" width="400" height="64" rx="10" fill="#141b20" stroke="#e8f0e8" stroke-width="2"/><text x="810" y="240" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">¿Opera sobre arreglos de números?</text><text x="810" y="262" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">columnas, vectores, matrices</text><line x1="890" y1="276" x2="940" y2="400" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="925.0" y="334.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">sí</text><line x1="730" y1="276" x2="680" y2="334" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="695.0" y="301.0" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">no</text><rect x="840.0" y="404.0" width="200" height="92" rx="10" fill="#16302a" stroke="#ffc857" stroke-width="2"/><text x="940" y="434" fill="#ffc857" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">vectoriza</text><text x="940" y="458" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">NumPy, Polars</text><text x="940" y="480" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el bucle sale de Python</text><rect x="510.0" y="334.0" width="300" height="64" rx="10" fill="#141b20" stroke="#e8f0e8" stroke-width="2"/><text x="660" y="362" fill="#e8f0e8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">¿Pedazos independientes</text><text x="660" y="384" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">y más largos que arrancar un proceso?</text><line x1="700" y1="398" x2="700" y2="520" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="712" y="470" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">sí</text><rect x="600.0" y="520.0" width="200" height="92" rx="10" fill="#16302a" stroke="#7ef29d" stroke-width="2"/><text x="700" y="550" fill="#7ef29d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">procesos</text><text x="700" y="574" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">ProcessPoolExecutor</text><text x="700" y="596" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">hasta el número de CPU</text><line x1="610" y1="398" x2="500" y2="520" stroke="#4a7a63" stroke-width="2" marker-end="url(#f4a7a63)"/><text x="530" y="470" fill="#ffc857" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">no</text><rect x="360.0" y="520.0" width="200" height="92" rx="10" fill="#16302a" stroke="#a7b8ad" stroke-width="2"/><text x="460" y="550" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">secuencial</text><text x="460" y="574" fill="#e8f0e8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" text-anchor="middle">un for</text><text x="460" y="596" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">mejora el algoritmo</text><text x="150" y="548" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">¿esperas y cálculo juntos?</text><text x="150" y="570" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">asyncio para la red,</text><text x="150" y="592" fill="#a7b8ad" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">procesos para el cálculo</text></svg>